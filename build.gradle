// AdvancedShader ported to Minecraft 1.10.2.
// ForgeGradle 2.3 on Gradle 4.x on JDK 8. Java 8 syntax only.

buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = project.mod_version
group = 'advancedshader'
archivesBaseName = 'AdvancedShader-1.10.2'

sourceCompatibility = 1.8
targetCompatibility = 1.8

minecraft {
    suppressVersionTest = true
    version = project.mc_version + '-' + project.forge_version
    runDir = 'run'
    mappings = project.mcp_version
    makeObfSourceJar = false
}

repositories {
    maven { url = 'https://maven.minecraftforge.net' }
    mavenCentral()
}

// OptiFine H5 is the hard dependency: compile against its classes, which are the
// classes the mod patches. The jar stays compileOnly, because at runtime the user's
// own OptiFine_1.10.2_HD_U_H5.jar provides them.
dependencies {
    compileOnly files('libs/OptiFine-H5-DEOBF-DO-NOT-PUT-IN-MODS.jar')
}

jar {
    archiveName = 'AdvancedShader-1.0-FINAL-1.10.2.jar'
    manifest {
        attributes([
            'TweakClass': 'advancedshader.core.Core',
            'TweakOrder': '-999',
            'Implementation-Version': project.version
        ])
    }
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000', '-Xlint:-options']
}
